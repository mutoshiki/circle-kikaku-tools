<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1200, initial-scale=1">
  <title>精算入力 サムネイル</title>
  <link rel="stylesheet" href="../../assets/vendor/ibm-plex/plex.css">
  <link rel="stylesheet" href="../../assets/css/share-thumbnail/01-thumbnail.css">
</head>
<body>
  <main class="ogp-canvas" aria-label="精算入力の共有用サムネイル">
    <section class="ogp-copy-panel">
      <div class="ogp-brand">
        <span class="ogp-brand-mark">
          <svg class="carbon-icon" fill="currentColor" viewBox="0 0 32 32" aria-hidden="true"><path d="M26 2H6a2 2 0 0 0-2 2v24a2 2 0 0 0 2 2h20a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2ZM6 4h20v6H6V4Zm0 8h5v5H6v-5Zm7 0h5v5h-5v-5Zm7 0h6v5h-6v-5ZM6 19h5v4H6v-4Zm7 0h5v4h-5v-4Zm7 0h6v9h-6v-9ZM6 25h5v3H6v-3Zm7 0h5v3h-5v-3Z"/></svg>
        </span>
        <span class="ogp-brand-name">サークル企画ツール</span>
      </div>

      <div class="ogp-heading-group">
        <span class="ogp-mode-tag">入力用</span>
        <h1 class="ogp-title">精算入力</h1>
        <p class="ogp-description">車ごとの費用を入力し、<br>徴収額を決定</p>
      </div>

      <div class="ogp-copy-footer">精算の共有リンク</div>
    </section>

    <section class="ogp-visual-panel" aria-hidden="true">
      <div class="ogp-app-frame">
        <header class="ogp-app-frame-header">
          <div class="ogp-app-frame-title">
            <svg class="carbon-icon" fill="currentColor" viewBox="0 0 32 32"><path d="M26 2H6a2 2 0 0 0-2 2v24a2 2 0 0 0 2 2h20a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2ZM6 4h20v6H6V4Zm0 8h5v5H6v-5Zm7 0h5v5h-5v-5Zm7 0h6v5h-6v-5ZM6 19h5v4H6v-4Zm7 0h5v4h-5v-4Zm7 0h6v9h-6v-9ZM6 25h5v3H6v-3Zm7 0h5v3h-5v-3Z"/></svg>
            <span>精算入力</span>
          </div>
          <span class="ogp-app-frame-meta">車ごとの費用</span>
        </header>
        <div class="ogp-app-frame-body">
          <div class="ogp-input-stack">
            <div class="ogp-input-row">
              <div class="ogp-input-label">
                <svg class="carbon-icon" fill="currentColor" viewBox="0 0 32 32"><path d="M29.4 13.7 26 7.2A4 4 0 0 0 22.5 5h-13A4 4 0 0 0 6 7.2l-3.4 6.5A3.9 3.9 0 0 0 2 15.6V24h3v3h4v-3h14v3h4v-3h3v-8.4a3.9 3.9 0 0 0-.6-1.9ZM7.8 8.1A2 2 0 0 1 9.5 7h13a2 2 0 0 1 1.7 1.1l2.6 4.9H5.2l2.6-4.9ZM28 22H4v-6.4c0-.3.1-.5.2-.6h23.6c.1.1.2.3.2.6V22Z"/></svg>
                <span>ガソリン代</span>
              </div>
              <div class="ogp-input-value">¥ 6,420</div>
            </div>
            <div class="ogp-input-row">
              <div class="ogp-input-label">
                <svg class="carbon-icon" fill="currentColor" viewBox="0 0 32 32"><path d="M25 2H7a3 3 0 0 0-3 3v25l5-3 4 3 3-3 3 3 4-3 5 3V5a3 3 0 0 0-3-3Zm1 24.5-3-1.8-4 3-3-3-3 3-4-3-3 1.8V5a1 1 0 0 1 1-1h18a1 1 0 0 1 1 1v21.5ZM9 8h14v2H9V8Zm0 5h14v2H9v-2Zm0 5h9v2H9v-2Z"/></svg>
                <span>諸経費</span>
              </div>
              <div class="ogp-input-value">¥ 1,200</div>
            </div>
          </div>

          <div class="ogp-settlement-total">
            <div class="ogp-total-label"><strong>徴収額</strong><span>1人あたり</span></div>
            <div class="ogp-total-value">¥ 2,100</div>
          </div>

          <div class="ogp-progress-row">
            <span>入力状況</span>
            <div class="ogp-progress-track"><div class="ogp-progress-fill"></div></div>
            <span>3 / 4台</span>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
