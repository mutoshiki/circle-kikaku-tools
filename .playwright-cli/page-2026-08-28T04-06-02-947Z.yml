        - article "使い方" [ref=e1299]:
          - generic [ref=e1300]:
            - paragraph [ref=e1301]: 参加者の選択、車割、班割、精算を上部の4つのタブから行います。
            - figure "参加者 → 車割 → 班割 → 精算の順に操作します。" [ref=e1302]:
              - img "スマホ画面上部のメインタブとメニュー" [ref=e1303]
          - navigation "使い方の目次" [ref=e1305]:
            - link "参加者" [ref=e1306] [cursor=pointer]:
              - /url: "#manual-register"
            - link "車割" [ref=e1307] [cursor=pointer]:
              - /url: "#manual-car"
            - link "班割" [ref=e1308] [cursor=pointer]:
              - /url: "#manual-team"
            - link "共有" [ref=e1309] [cursor=pointer]:
              - /url: "#manual-share"
            - link "精算" [ref=e1310] [cursor=pointer]:
              - /url: "#manual-settlement"
          - generic [ref=e1311]:
            - generic [ref=e1312]:
              - generic [ref=e1313]: "1"
              - heading "参加者を決める" [level=2] [ref=e1314]
            - paragraph [ref=e1315]: 「参加者」タブで応募者を確認し、企画に参加する人を選びます。手動で追加する場合もこの画面から行います。
            - figure [ref=e1316]:
              - img "スマホの参加者画面" [ref=e1317]
          - generic [ref=e1318]:
            - generic [ref=e1319]:
              - generic [ref=e1320]: "2"
              - heading "車割を作る" [level=2] [ref=e1321]
            - paragraph [ref=e1322]: 「車割」タブで各車の空席に参加者を追加します。全体を作り直したいときは「ランダム割り当て」を押すだけで、ロックしていない参加者をランダムに配置できます。
            - paragraph [ref=e1323]: 各参加者のメニューから「運転手にする／運転手を外す」を切り替えられます。運転手は1台に複数人設定でき、運転手タグが付いた人は車内の上側に並びます。
            - figure [ref=e1324]:
              - img "スマホの車割画面" [ref=e1325]
          - generic [ref=e1326]:
            - generic [ref=e1327]:
              - generic [ref=e1328]: "3"
              - heading "班割を作る" [level=2] [ref=e1329]
            - paragraph [ref=e1330]: 「班割」タブは車割とは別の画面です。空席から参加者を追加し、必要なら「ランダム割り当て」で全体を作り直します。
            - paragraph [ref=e1331]: 班長も参加者メニューからオン・オフできます。複数人に設定でき、班長タグが付いた参加者は班内の上側に並びます。
            - figure [ref=e1332]:
              - img "スマホの班割画面" [ref=e1333]
          - generic [ref=e1334]:
            - generic [ref=e1335]:
              - generic [ref=e1336]: "4"
              - heading "企画を共有する" [level=2] [ref=e1337]
            - paragraph [ref=e1338]: 右上の共有ボタンは、車割・班割専用の特別画面ではなく通常の企画ルームのリンクをコピーします。同じリンクから参加者、車割、班割、精算へ移動できます。
            - figure [ref=e1339]:
              - img "スマホで企画ルームを共有する画面" [ref=e1340]
          - generic [ref=e1341]:
            - generic [ref=e1342]:
              - generic [ref=e1343]: "5"
              - heading "精算する" [level=2] [ref=e1344]
            - paragraph [ref=e1345]: 「精算」タブで端数処理や車ごとの費用を設定し、集金額と運転手への支払いを確認します。
            - figure [ref=e1346]:
              - img "スマホの精算設定画面" [ref=e1347]
            - heading "車ごとの費用" [level=3] [ref=e1348]
            - paragraph [ref=e1349]: 各車の「編集」から距離・燃費・単価・高速代などを入力します。必要ならレンタカー料金も追加できます。
            - figure [ref=e1350]:
              - img "スマホの車ごとの費用入力画面" [ref=e1351]
            - heading "結果" [level=3] [ref=e1352]
            - paragraph [ref=e1353]: 合計、運転手への支払い、集金状況を確認します。「精算メモをコピー」で連絡用の文章をコピーできます。
            - generic [ref=e1354]:
              - figure [ref=e1355]:
                - img "スマホの精算結果上部" [ref=e1356]
              - figure [ref=e1357]:
                - img "スマホの集金チェックと精算メモ" [ref=e1358]
          - generic [ref=e1359]:
            - generic [ref=e1360]:
              - generic [ref=e1361]: "6"
              - heading "保存と同期" [level=2] [ref=e1362]
            - paragraph [ref=e1363]: 変更は自動保存されます。共有同期中なら同じ企画リンクを別の端末で開いて続きから操作できます。
