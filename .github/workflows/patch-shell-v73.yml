name: Patch Shell V73

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feat/carbon-project-title-navigation-v73

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/carbon-project-title-navigation-v73
      - run: python3 tools/patch-shell-v73.py
      - run: git diff --check
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/features/events/02-static-header-events.js tests/carbon-complete.visual.spec.js tests/shell-project-title-navigation-v73.spec.js tests/shell-project-title-navigation-v73-contract.mjs
          git commit -m "Fix project title gestures and app navigation toggle"
          git push
