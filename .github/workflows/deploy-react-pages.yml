name: Legacy Root Rollback

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: react-production-release
  cancel-in-progress: false

jobs:
  build-rollback:
    name: Rollback / Build pinned legacy artifact
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: e37b8651eeba1cb52d2b7a98bc05674bb63591a8
          persist-credentials: false
      - uses: actions/configure-pages@v6
      - name: Build the pinned legacy release
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Verify legacy entry point
        run: test -s _site/index.html
      - name: Upload rollback artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-legacy-rollback
          path: ./_site

  deploy-rollback:
    name: Rollback / Restore legacy at root
    needs: build-rollback
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the legacy rollback artifact
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-legacy-rollback
