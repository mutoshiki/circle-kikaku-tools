name: Apply mobile fix v71

on:
  push:
    branches:
      - fix-mobile-share-allocation-settlement-20260820

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-mobile-share-allocation-settlement-20260820
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply owner-file fixes
        run: node tools/apply-mobile-fix-v71.mjs
      - name: Validate targeted contracts
        run: |
          node tests/design-refinement-contract.mjs
          node tests/person-card-interaction-contract.mjs
          node tests/carbon-guidance-v35-contract.mjs
          node tests/settlement-concurrent-save-v48-contract.mjs
          node tests/settlement-cross-car-sync-v49-contract.mjs
          node tests/settlement-negative-extra-save-v51-contract.mjs
          git diff --check
      - name: Commit applied files
        shell: bash
        run: |
          # This workflow is temporary; it only applies already browser-checked owner-file changes.
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets tests
          git commit -m "Fix mobile shared, allocation, and settlement UI"
          git push origin HEAD:fix-mobile-share-allocation-settlement-20260820
