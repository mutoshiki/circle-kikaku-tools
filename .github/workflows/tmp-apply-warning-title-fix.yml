name: Temporary patch applicator

on:
  push:
    branches:
      - fix/warning-and-project-title-scroll

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/warning-and-project-title-scroll
      - name: Apply focused patch
        shell: python
        run: |
          from pathlib import Path

          header = Path('assets/js/features/events/02-static-header-events.js')
          text = header.read_text()
          old = """        scrollNodes.forEach(node => node.addEventListener('scroll', () => {\n            if (Number(node.scrollTop || 0) > PROJECT_TITLE_SCROLL_THRESHOLD) setProjectTitleExpanded(false);\n        }, { passive: true }));\n"""
          new = """        scrollNodes.forEach(node => node.addEventListener('scroll', () => {\n            const scrollTop = Number(node.scrollTop || 0);\n            if (scrollTop > PROJECT_TITLE_SCROLL_THRESHOLD) {\n                setProjectTitleExpanded(false);\n                return;\n            }\n            if (scrollTop <= 0) setProjectTitleExpanded(true);\n        }, { passive: true }));\n"""
          if old not in text:
              raise SystemExit('project title scroll owner block not found')
          header.write_text(text.replace(old, new, 1))

          spec = Path('tests/shell-project-title-navigation-v73.spec.js')
          text = spec.read_text()
          marker = """}\n"""
          addition = r'''

test('390px title expands as the active scroll container reaches the top', async ({ page }) => {
  await page.setViewportSize({ width: 390, height: 844 });
  await page.goto('/');
  await page.waitForFunction(() => document.querySelector('#projectTitleRegion'));

  const title = page.locator('#projectTitleRegion');
  await page.dispatchEvent('#top-area', 'pointerdown', { pointerType: 'touch', clientY: 180, pointerId: 11, isPrimary: true });
  await page.dispatchEvent('#top-area', 'pointermove', { pointerType: 'touch', clientY: 148, pointerId: 11, isPrimary: true });
  await page.dispatchEvent('#top-area', 'pointerup', { pointerType: 'touch', clientY: 148, pointerId: 11, isPrimary: true });
  await expect(title).toHaveAttribute('data-state', 'collapsed');

  await page.evaluate(() => {
    const scroller = document.getElementById('top-area');
    Object.defineProperty(scroller, 'scrollTop', { configurable: true, writable: true, value: 24 });
    scroller.dispatchEvent(new Event('scroll'));
    scroller.scrollTop = 0;
    scroller.dispatchEvent(new Event('scroll'));
  });

  await expect(title).toHaveAttribute('data-state', 'expanded');
  await expect.poll(() => title.evaluate(node => node.getBoundingClientRect().height)).toBeGreaterThan(1);
});
'''
          spec.write_text(text.rstrip() + addition + '\n')

          status_spec = Path('tests/status-toast-policy-v79.spec.js')
          text = status_spec.read_text()
          insert = r'''

  test('dynamic Carbon warning state is rendered after an already-mounted field changes', async ({ page }) => {
    await page.goto('/');
    await waitForApp(page);
    const result = await page.evaluate(async () => {
      const host = document.createElement('cds-text-input');
      host.id = 'dynamicWarningProbe';
      host.setAttribute('label', '金額');
      document.body.appendChild(host);
      await customElements.whenDefined('cds-text-input');
      await host.updateComplete;
      host.classList.add('is-warning');
      host.setAttribute('data-warning-text', '入力内容を確認してください');
      await new Promise(resolve => setTimeout(resolve, 50));
      await host.updateComplete;
      return {
        warn: host.hasAttribute('warn'),
        warnText: host.getAttribute('warn-text'),
        shadowText: host.shadowRoot?.textContent || ''
      };
    });
    expect(result.warn).toBeTruthy();
    expect(result.warnText).toBe('入力内容を確認してください');
    expect(result.shadowText).toContain('入力内容を確認してください');
  });
'''
          needle = "\n  test('transaction transport readiness is retryable instead of a permanent rejection'"
          if needle not in text:
              raise SystemExit('status toast insertion point not found')
          status_spec.write_text(text.replace(needle, insert + needle, 1))

          workflow = Path('.github/workflows/tmp-apply-warning-title-fix.yml')
          workflow.unlink()
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix warning rendering regression and title reveal timing"
          git push
