name: Apply hamburger user-action tests

on:
  push:
    branches:
      - fix/production-hamburger-cache-20260825

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/production-hamburger-cache-20260825
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/patch-hamburger-user-action-tests.mjs
      - name: Commit migrated tests
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/carbon-complete.spec.js tests/shell-project-title-navigation-v73.spec.js
          git commit -m "ハンバーガー検査を実ユーザークリックへ移行"
          git push origin HEAD:fix/production-hamburger-cache-20260825
