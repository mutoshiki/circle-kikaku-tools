name: Apply Carbon follow-up
on:
  push:
    branches:
      - carbon-full-ui-refresh-20260820
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-followup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: carbon-full-ui-refresh-20260820
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply and validate follow-up
        id: validate
        shell: bash
        run: |
          set +e
          STATUS=.github/carbon-apply-status.log
          : > "$STATUS"
          echo "head=$(git rev-parse HEAD)" >> "$STATUS"
          echo "run_id=${{ github.run_id }}" >> "$STATUS"
          echo "started=$(date -u +%FT%TZ)" >> "$STATUS"
          run_checked() {
            echo "" >> "$STATUS"
            echo "## $*" >> "$STATUS"
            "$@" >> "$STATUS" 2>&1
            code=$?
            echo "exit=$code" >> "$STATUS"
            return $code
          }
          ok=1
          run_checked npm ci --no-audit --no-fund || ok=0
          if [ "$ok" -eq 1 ]; then run_checked git apply --check -p1 .github/carbon-followup.patch || ok=0; fi
          if [ "$ok" -eq 1 ]; then run_checked git apply -p1 .github/carbon-followup.patch || ok=0; fi
          if [ "$ok" -eq 1 ]; then run_checked npm run build:carbon || ok=0; fi
          if [ "$ok" -eq 1 ]; then run_checked git diff --exit-code -- assets/vendor/carbon assets/vendor/ibm-plex || ok=0; fi
          if [ "$ok" -eq 1 ]; then run_checked npm run lint:css || ok=0; fi
          if [ "$ok" -eq 1 ]; then run_checked npm test || ok=0; fi
          echo "" >> "$STATUS"
          echo "result=$([ "$ok" -eq 1 ] && echo success || echo failure)" >> "$STATUS"
          echo "finished=$(date -u +%FT%TZ)" >> "$STATUS"
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit follow-up and status
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/carbon-apply-status.log
          if [ "${{ steps.validate.outputs.ok }}" = "1" ]; then
            git add assets/ tests/
            git commit -m "Finish Carbon responsive UI contracts"
          else
            git commit -m "Record Carbon follow-up validation failure"
          fi
          git push origin HEAD:carbon-full-ui-refresh-20260820
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: carbon-refresh-worktree
          path: |
            .
            !node_modules/**
            !.git/**
          retention-days: 2
