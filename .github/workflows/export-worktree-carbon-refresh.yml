name: Validate Carbon browser UI
on:
  push:
    branches:
      - carbon-full-ui-refresh-20260820
  workflow_dispatch:

permissions:
  contents: write

jobs:
  browser:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: carbon-full-ui-refresh-20260820
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate final Carbon layout
        id: validate
        shell: bash
        run: |
          set +e
          STATUS=.github/carbon-apply-status.log
          : > "$STATUS"
          echo "head=$(git rev-parse HEAD)" >> "$STATUS"
          echo "run_id=${{ github.run_id }}" >> "$STATUS"
          echo "started=$(date -u +%FT%TZ)" >> "$STATUS"
          run_checked() {
            echo "" >> "$STATUS"
            echo "## $*" >> "$STATUS"
            "$@" >> "$STATUS" 2>&1
            code=$?
            echo "exit=$code" >> "$STATUS"
            return $code
          }
          ok=1
          run_checked npm ci --no-audit --no-fund || ok=0
          if [ "$ok" -eq 1 ]; then run_checked git apply --check -p1 .github/browser-test-followup.patch || ok=0; fi
          if [ "$ok" -eq 1 ]; then run_checked git apply -p1 .github/browser-test-followup.patch || ok=0; fi
          if [ "$ok" -eq 1 ]; then run_checked git apply --check -p1 .github/carbon-nav-final.patch || ok=0; fi
          if [ "$ok" -eq 1 ]; then run_checked git apply -p1 .github/carbon-nav-final.patch || ok=0; fi
          if [ "$ok" -eq 1 ]; then run_checked npm run build:carbon || ok=0; fi
          if [ "$ok" -eq 1 ]; then run_checked git diff --exit-code -- assets/vendor/carbon assets/vendor/ibm-plex || ok=0; fi
          if [ "$ok" -eq 1 ]; then run_checked npm run lint:css || ok=0; fi
          if [ "$ok" -eq 1 ]; then run_checked npm test || ok=0; fi
          if [ "$ok" -eq 1 ]; then run_checked npx playwright install --with-deps chromium || ok=0; fi
          if [ "$ok" -eq 1 ]; then run_checked npm run test:ui || ok=0; fi
          if [ "$ok" -eq 1 ]; then run_checked npm run test:visual || ok=0; fi
          echo "" >> "$STATUS"
          echo "result=$([ "$ok" -eq 1 ] && echo success || echo failure)" >> "$STATUS"
          echo "finished=$(date -u +%FT%TZ)" >> "$STATUS"
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit validated Carbon layout and status
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/carbon-apply-status.log
          if [ "${{ steps.validate.outputs.ok }}" = "1" ]; then
            git add \
              assets/css/app-shell/layout/04-layering.css \
              assets/css/app-shell/header/03-tabs-actions.css \
              index.html \
              tests/carbon-complete.spec.js \
              tests/carbon-complete.visual.spec.js
            git commit -m "Finish Carbon responsive tab navigation"
          else
            git commit -m "Record final Carbon layout validation failure"
          fi
          git push origin HEAD:carbon-full-ui-refresh-20260820
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: carbon-browser-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: carbon-refresh-worktree
          path: |
            .
            !node_modules/**
            !.git/**
          retention-days: 2
