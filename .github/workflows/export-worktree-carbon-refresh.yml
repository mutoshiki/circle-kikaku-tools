name: Apply Carbon refresh
on:
  push:
    branches:
      - carbon-full-ui-refresh-20260820
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: carbon-full-ui-refresh-20260820
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply and build queued Carbon refactor
        id: apply
        shell: bash
        run: |
          set +e
          STATUS=.github/carbon-apply-status.log
          : > "$STATUS"
          echo "head=$(git rev-parse HEAD)" >> "$STATUS"
          echo "started=$(date -u +%FT%TZ)" >> "$STATUS"

          run_checked() {
            echo "" >> "$STATUS"
            echo "## $*" >> "$STATUS"
            "$@" >> "$STATUS" 2>&1
            code=$?
            echo "exit=$code" >> "$STATUS"
            return $code
          }

          ok=1
          run_checked npm ci --no-audit --no-fund || ok=0
          if [ "$ok" -eq 1 ]; then
            for p in .github/carbon-refresh-part-{1,2,3,4}.patch; do
              echo "" >> "$STATUS"
              echo "## check $p" >> "$STATUS"
              git apply --check -p1 "$p" >> "$STATUS" 2>&1
              code=$?
              echo "exit=$code" >> "$STATUS"
              if [ "$code" -ne 0 ]; then ok=0; break; fi
              echo "## apply $p" >> "$STATUS"
              git apply -p1 "$p" >> "$STATUS" 2>&1
              code=$?
              echo "exit=$code" >> "$STATUS"
              if [ "$code" -ne 0 ]; then ok=0; break; fi
            done
          fi
          if [ "$ok" -eq 1 ]; then run_checked npm run build:carbon || ok=0; fi
          if [ "$ok" -eq 1 ]; then run_checked npm run lint:css || ok=0; fi
          if [ "$ok" -eq 1 ]; then run_checked git diff --check || ok=0; fi
          echo "" >> "$STATUS"
          echo "result=$([ "$ok" -eq 1 ] && echo success || echo failure)" >> "$STATUS"
          echo "finished=$(date -u +%FT%TZ)" >> "$STATUS"
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit applied source and diagnostics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/carbon-apply-status.log
          if [ "${{ steps.apply.outputs.ok }}" = "1" ]; then
            git add index.html assets/
            git diff --cached --check
            git commit -m "Apply Carbon responsive UI refactor"
          else
            git commit -m "Record Carbon patch application failure"
          fi
          git push origin HEAD:carbon-full-ui-refresh-20260820
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: carbon-refresh-worktree
          path: |
            .
            !node_modules/**
            !.git/**
          retention-days: 2
