name: Apply Carbon refresh
on:
  push:
    branches:
      - carbon-full-ui-refresh-20260820
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: carbon-full-ui-refresh-20260820
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply queued Carbon patches
        run: |
          for p in .github/carbon-refresh-part-{1,2,3,4}.patch; do
            git apply --check -p1 "$p"
            git apply -p1 "$p"
          done
      - run: npm run build:carbon
      - run: npm run test:static
      - run: git diff --check
      - name: Commit applied refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/
          git diff --cached --check
          git commit -m "Apply Carbon responsive UI refactor"
          git push origin HEAD:carbon-full-ui-refresh-20260820
      - uses: actions/upload-artifact@v4
        with:
          name: carbon-refresh-worktree
          path: |
            .
            !node_modules/**
            !.git/**
          retention-days: 2
