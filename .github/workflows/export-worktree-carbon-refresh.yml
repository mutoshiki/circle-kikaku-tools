name: Carbon refresh worktree export
on:
  push:
    branches:
      - carbon-full-ui-refresh-20260820

permissions:
  contents: write

jobs:
  apply-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: carbon-full-ui-refresh-20260820
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply verified UI patches
        run: |
          patch --dry-run -p1 < .github/carbon-refresh-part-1.patch
          patch --dry-run -p1 < .github/carbon-refresh-part-2.patch
          patch --dry-run -p1 < .github/carbon-refresh-part-3.patch
          patch --dry-run -p1 < .github/carbon-refresh-part-4.patch
          patch -p1 < .github/carbon-refresh-part-1.patch
          patch -p1 < .github/carbon-refresh-part-2.patch
          patch -p1 < .github/carbon-refresh-part-3.patch
          patch -p1 < .github/carbon-refresh-part-4.patch
      - run: npm ci --no-audit --no-fund
      - run: npm run build:carbon
      - name: Commit built application changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/
          git diff --cached --check
          git commit -m "Apply Carbon responsive UI refresh"
          git push origin HEAD:carbon-full-ui-refresh-20260820
