name: Apply shared touch scroll v72

on:
  push:
    branches:
      - fix-shared-touch-scroll-cue-20260820

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-shared-touch-scroll-cue-20260820
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply owner-file repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'pattern not found in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          Path('assets/css/sheet-view/gestures/01-touch-navigation.css').write_text('''/* Shared-view gesture ownership. Desktop keeps the legacy direct pan/zoom\n * canvas; responsive layouts return one-finger vertical movement to the\n * browser so the shared view behaves like a native scroll surface. */\n#sheet-canvas {\n  cursor: grab;\n}\n\n@media (min-width: 1056px) {\n  #sheet-canvas { touch-action: none; }\n}\n\n@media (max-width: 1055px) {\n  #sheet-view-area,\n  #sheet-canvas { touch-action: pan-y; }\n\n  #sheet-canvas { cursor: auto; }\n\n  /* Carbon overflow guidance uses a visible content fade to communicate that\n   * more content continues below the fold. The class is removed at the end. */\n  #sheet-view-area.sheet-has-more-below {\n    -webkit-mask-image: linear-gradient(to bottom, #000 0, #000 calc(100% - 48px), transparent 100%);\n    mask-image: linear-gradient(to bottom, #000 0, #000 calc(100% - 48px), transparent 100%);\n  }\n}\n\n#sheet-content {\n  transform-origin: 0 0;\n  will-change: transform;\n}\n\n#sheet-view-area.is-panning {\n  cursor: grabbing;\n  user-select: none;\n}\n\n#sheet-canvas:focus-visible {\n  outline: 3px solid var(--focus-accent);\n  outline-offset: -3px;\n}\n\n/* Persistent, low-noise horizontal pan affordance for the desktop canvas. */\n#sheet-view-area.sheet-needs-pan #sheet-canvas::before,\n#sheet-view-area.sheet-needs-pan #sheet-canvas::after {\n  content: "";\n  position: absolute;\n  top: 76px;\n  bottom: 72px;\n  z-index: var(--z-local-sticky);\n  width: 24px;\n  pointer-events: none;\n}\n#sheet-view-area.sheet-needs-pan #sheet-canvas::before {\n  left: 0;\n  background: linear-gradient(90deg, color-mix(in srgb, var(--bg-body) 86%, transparent), transparent);\n}\n#sheet-view-area.sheet-needs-pan #sheet-canvas::after {\n  right: 0;\n  background: linear-gradient(270deg, color-mix(in srgb, var(--bg-body) 86%, transparent), transparent);\n}\n#sheet-bottom-controls {\n  display: flex;\n  align-items: center;\n  gap: 0;\n}\n''')

          replace_once(
              'assets/css/sheet-view/layout/01-sheet-frame.css',
              '    -webkit-overflow-scrolling: touch;\n    touch-action: pan-y;\n',
              '    -webkit-overflow-scrolling: touch;\n'
          )

          viewport = Path('assets/js/features/sheet/02-viewport-controls.js')
          text = viewport.read_text()
          marker = '''function usesResponsiveSheetViewport(area = byId('sheet-view-area')) {\n    return !!area && area.clientWidth < 1056;\n}\n'''
          addition = marker + '''\nfunction getSheetVerticalScrollHost(area = byId('sheet-view-area')) {\n    if (!area) return null;\n    return usesResponsiveSheetViewport(area) ? area : byId('sheet-canvas');\n}\n\nfunction updateSheetScrollAffordance(area = byId('sheet-view-area')) {\n    if (!area) return;\n    const host = getSheetVerticalScrollHost(area);\n    if (!host || !area.classList.contains('active')) {\n        area.classList.remove('sheet-has-more-below');\n        return;\n    }\n    const maxScrollTop = Math.max(0, host.scrollHeight - host.clientHeight);\n    const hasMoreBelow = maxScrollTop > 8 && host.scrollTop < maxScrollTop - 8;\n    area.classList.toggle('sheet-has-more-below', hasMoreBelow);\n}\nwindow.updateSheetScrollAffordance = updateSheetScrollAffordance;\n'''
          if marker not in text:
              raise SystemExit('viewport insertion marker missing')
          text = text.replace(marker, addition, 1)

          text = text.replace(
              '''        content.style.zoom = '';\n        content.style.transform = 'none';\n        return;\n''',
              '''        content.style.zoom = '';\n        content.style.transform = 'none';\n        requestAnimationFrame(() => updateSheetScrollAffordance(area));\n        return;\n''',
              1
          )
          text = text.replace(
              '''    if (sheetUserAdjusted) {\n        applySheetTransform();\n        return;\n    }\n''',
              '''    if (sheetUserAdjusted) {\n        applySheetTransform();\n        requestAnimationFrame(() => updateSheetScrollAffordance(area));\n        return;\n    }\n''',
              1
          )
          text = text.replace(
              '''    area.classList.add('sheet-fit-active');\n    applySheetTransform();\n}\n''',
              '''    area.classList.add('sheet-fit-active');\n    applySheetTransform();\n    requestAnimationFrame(() => updateSheetScrollAffordance(area));\n}\n''',
              1
          )
          dom_marker = '''D.addEventListener('DOMContentLoaded', () => {\n    const area = byId('sheet-view-area');\n    if (!area) return;\n'''
          dom_addition = dom_marker + '''\n    const canvas = byId('sheet-canvas');\n    const updateScrollAffordance = () => updateSheetScrollAffordance(area);\n    area.addEventListener('scroll', updateScrollAffordance, { passive: true });\n    canvas?.addEventListener('scroll', updateScrollAffordance, { passive: true });\n    if (typeof ResizeObserver === 'function') {\n        const scrollAffordanceObserver = new ResizeObserver(() => requestAnimationFrame(updateScrollAffordance));\n        scrollAffordanceObserver.observe(area);\n        if (canvas) scrollAffordanceObserver.observe(canvas);\n    }\n    requestAnimationFrame(updateScrollAffordance);\n'''
          if dom_marker not in text:
              raise SystemExit('DOMContentLoaded marker missing')
          text = text.replace(dom_marker, dom_addition, 1)
          text = text.replace(
              '''    window.addEventListener('resize', () => {\n        if (!sheetUserAdjusted) requestAnimationFrame(fitInitialSheetScale);\n    });\n''',
              '''    window.addEventListener('resize', () => {\n        if (!sheetUserAdjusted) requestAnimationFrame(fitInitialSheetScale);\n        requestAnimationFrame(updateScrollAffordance);\n    });\n''',
              1
          )
          viewport.write_text(text)

          replace_once(
              'index.html',
              './assets/css/sheet-view/layout/01-sheet-frame.css?v=carbon-ui-actions-v61-mobile-fix-v71',
              './assets/css/sheet-view/layout/01-sheet-frame.css?v=carbon-ui-actions-v61-mobile-fix-v71-shared-touch-scroll-v72'
          )
          replace_once(
              'index.html',
              './assets/css/sheet-view/gestures/01-touch-navigation.css?v=feature-polish-v27',
              './assets/css/sheet-view/gestures/01-touch-navigation.css?v=feature-polish-v27-shared-touch-scroll-v72'
          )
          replace_once(
              'index.html',
              './assets/js/features/sheet/02-viewport-controls.js?v=feature-fixes-v30',
              './assets/js/features/sheet/02-viewport-controls.js?v=feature-fixes-v30-shared-touch-scroll-v72'
          )

          contract = Path('tests/design-refinement-contract.mjs')
          text = contract.read_text()
          read_marker = "const sheetFrame = await read('assets/css/sheet-view/layout/01-sheet-frame.css');\n"
          read_addition = read_marker + "const sheetTouchNavigation = await read('assets/css/sheet-view/gestures/01-touch-navigation.css');\nconst sheetViewportControls = await read('assets/js/features/sheet/02-viewport-controls.js');\n"
          if read_marker not in text:
              raise SystemExit('contract read marker missing')
          text = text.replace(read_marker, read_addition, 1)
          assertion_marker = "expect(sheetFrame.includes('.sheet-content') && sheetFrame.includes('width: 100%;') && sheetFrame.includes('grid-template-columns: repeat(auto-fit'), 'Shared view must use a responsive full-width grid instead of desktop max-content geometry.');\n"
          assertion_addition = assertion_marker + "expect(sheetTouchNavigation.includes('@media (max-width: 1055px)') && sheetTouchNavigation.includes('#sheet-canvas { touch-action: pan-y; }'), 'Responsive shared view must return one-finger vertical gestures to native scrolling.');\nexpect(sheetTouchNavigation.includes('@media (min-width: 1056px)') && sheetTouchNavigation.includes('#sheet-canvas { touch-action: none; }'), 'Desktop shared canvas may retain direct pan/zoom touch ownership.');\nexpect(sheetTouchNavigation.includes('sheet-has-more-below') && sheetTouchNavigation.includes('-webkit-mask-image: linear-gradient'), 'Shared view must use Carbon-style overflow fade while more content remains below.');\nexpect(sheetViewportControls.includes('updateSheetScrollAffordance') && sheetViewportControls.includes("area.classList.toggle('sheet-has-more-below', hasMoreBelow)"), 'Shared overflow fade must track the real scroll position and clear at the end.');\n"
          if assertion_marker not in text:
              raise SystemExit('contract assertion marker missing')
          text = text.replace(assertion_marker, assertion_addition, 1)
          contract.write_text(text)

          spec = Path('tests/carbon-complete.spec.js')
          text = spec.read_text()
          spec_marker = "test.describe('Allocation, menus and accessibility', () => {\n"
          touch_test = r'''test.describe('Shared view native touch scrolling', () => {
  test.use({ viewport: { width: 390, height: 844 }, hasTouch: true });

  test('one-finger swipe scrolls the shared view and the Carbon overflow fade clears at the end', async ({ page }) => {
    await seed(page);
    await page.evaluate(() => window.switchView('sheet'));
    const area = page.locator('#sheet-view-area');
    const canvas = page.locator('#sheet-canvas');
    await expect(area).toBeVisible();
    await expect.poll(() => area.evaluate(node => node.scrollHeight - node.clientHeight)).toBeGreaterThan(80);
    expect(await canvas.evaluate(node => getComputedStyle(node).touchAction)).toBe('pan-y');
    await expect.poll(() => area.evaluate(node => node.classList.contains('sheet-has-more-below'))).toBe(true);
    expect(await area.evaluate(node => getComputedStyle(node).maskImage !== 'none' || getComputedStyle(node).webkitMaskImage !== 'none')).toBeTruthy();

    const box = await canvas.boundingBox();
    if (!box) throw new Error('shared canvas has no bounding box');
    const x = Math.round(box.x + box.width * 0.5);
    const startY = Math.round(Math.min(box.y + box.height - 96, 720));
    const endY = Math.round(Math.max(box.y + 120, startY - 300));
    const cdp = await page.context().newCDPSession(page);
    await cdp.send('Input.dispatchTouchEvent', { type: 'touchStart', touchPoints: [{ x, y: startY, radiusX: 6, radiusY: 6, force: 1 }] });
    for (let step = 1; step <= 6; step += 1) {
      const y = Math.round(startY + ((endY - startY) * step) / 6);
      await cdp.send('Input.dispatchTouchEvent', { type: 'touchMove', touchPoints: [{ x, y, radiusX: 6, radiusY: 6, force: 1 }] });
    }
    await cdp.send('Input.dispatchTouchEvent', { type: 'touchEnd', touchPoints: [] });
    await expect.poll(() => area.evaluate(node => node.scrollTop)).toBeGreaterThan(20);

    await area.evaluate(node => { node.scrollTop = node.scrollHeight; });
    await expect.poll(() => area.evaluate(node => node.classList.contains('sheet-has-more-below'))).toBe(false);
  });
});

test.describe('Allocation, menus and accessibility', () => {
'''
          if spec_marker not in text:
              raise SystemExit('Playwright insertion marker missing')
          text = text.replace(spec_marker, touch_test, 1)
          spec.write_text(text)
          PY
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify Carbon build and static contracts
        run: |
          npm run build:carbon
          git diff --exit-code -- assets/vendor/carbon assets/vendor/ibm-plex
          npm run lint:css
          npm test
          git diff --check
      - name: Verify real browser interaction
        run: |
          npx playwright install --with-deps chromium
          npm run test:ui
          npm run test:visual
      - name: Commit verified repair and remove applicator
        shell: bash
        run: |
          git rm .github/workflows/apply-shared-touch-scroll-v72.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            assets/css/sheet-view/layout/01-sheet-frame.css \
            assets/css/sheet-view/gestures/01-touch-navigation.css \
            assets/js/features/sheet/02-viewport-controls.js \
            index.html \
            tests/design-refinement-contract.mjs \
            tests/carbon-complete.spec.js
          git commit -m "Fix shared-view native touch scrolling"
          git push origin HEAD:fix-shared-touch-scroll-cue-20260820
