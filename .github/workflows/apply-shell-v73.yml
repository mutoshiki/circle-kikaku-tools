name: Apply Shell V73

on:
  push:
    branches:
      - feat/carbon-project-title-navigation-v73

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, 'temporary v73 implementation runner trigger')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/carbon-project-title-navigation-v73
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/apply-shell-v73.mjs
      - run: git diff --check
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement Carbon project title and app navigation"
          git push
