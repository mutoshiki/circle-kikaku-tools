name: Repair cache tags v71

on:
  push:
    branches:
      - fix-mobile-share-allocation-settlement-20260820

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-mobile-share-allocation-settlement-20260820
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preserve established cache-contract tags
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          let index = fs.readFileSync('index.html', 'utf8');
          const replacements = [
            ['assets/css/app-shell/layout/02-panels.css?v=mobile-fix-v71', 'assets/css/app-shell/layout/02-panels.css?v=toolbar-order-v70-mobile-fix-v71'],
            ['assets/css/app-shell/header/01-header-base.css?v=mobile-fix-v71', 'assets/css/app-shell/header/01-header-base.css?v=design-polish-v25-mobile-fix-v71'],
            ['assets/css/app-shell/header/03-tabs-actions.css?v=mobile-fix-v71', 'assets/css/app-shell/header/03-tabs-actions.css?v=carbon-layer-nav-v53-mobile-fix-v71'],
            ['assets/css/cars-members-tray/01-shared-card-primitives.css?v=mobile-fix-v71', 'assets/css/cars-members-tray/01-shared-card-primitives.css?v=carbon-layer-nav-v53-mobile-fix-v71'],
            ['assets/css/cars-members-tray/waiting-tray/06-action-and-list-layout.css?v=mobile-fix-v71', 'assets/css/cars-members-tray/waiting-tray/06-action-and-list-layout.css?v=waiting-grid-v52-carbon-layer-nav-v53-mobile-fix-v71'],
            ['assets/css/cars-members-tray/person-card/02-person-name-grade.css?v=mobile-fix-v71', 'assets/css/cars-members-tray/person-card/02-person-name-grade.css?v=settlement-balance-v58-mobile-fix-v71'],
            ['assets/css/cars-members-tray/person-card/03-person-menu.css?v=mobile-fix-v71', 'assets/css/cars-members-tray/person-card/03-person-menu.css?v=waiting-grid-v52-carbon-layer-nav-v53-mobile-fix-v71'],
            ['assets/css/cars-members-tray/car-card/04-group-mode.css?v=mobile-fix-v71', 'assets/css/cars-members-tray/car-card/04-group-mode.css?v=toolbar-order-v70-mobile-fix-v71'],
            ['assets/css/settlement/car-inputs/03-extra-costs.css?v=mobile-fix-v71', 'assets/css/settlement/car-inputs/03-extra-costs.css?v=rendered-qa-v26-mobile-fix-v71'],
            ['assets/css/settlement/car-inputs/04-edit-modal.css?v=mobile-fix-v71', 'assets/css/settlement/car-inputs/04-edit-modal.css?v=ui-fix-1-mobile-fix-v71'],
            ['assets/css/sheet-view/layout/01-sheet-frame.css?v=mobile-fix-v71', 'assets/css/sheet-view/layout/01-sheet-frame.css?v=carbon-ui-actions-v61-mobile-fix-v71'],
            ['assets/css/settlement/05-carbon-layout-refinement.css?v=mobile-fix-v71', 'assets/css/settlement/05-carbon-layout-refinement.css?v=carbon-official-layout-7-mobile-fix-v71'],
            ['assets/js/core/modal-controller.js?v=mobile-fix-v71', 'assets/js/core/modal-controller.js?v=settlement-extra-concurrent-v66-mobile-fix-v71'],
            ['assets/js/templates/settlement/04-extra-input-templates.js?v=mobile-fix-v71', 'assets/js/templates/settlement/04-extra-input-templates.js?v=settlement-extra-concurrent-v66-mobile-fix-v71'],
            ['assets/js/templates/settlement/03-car-cost-templates.js?v=mobile-fix-v71', 'assets/js/templates/settlement/03-car-cost-templates.js?v=carbon-rework-6-mobile-fix-v71'],
            ['assets/js/features/person-cards.js?v=mobile-fix-v71', 'assets/js/features/person-cards.js?v=driver-role-v70-mobile-fix-v71'],
            ['assets/js/features/sheet-view.js?v=mobile-fix-v71', 'assets/js/features/sheet-view.js?v=shared-counts-v62-mobile-fix-v71']
          ];
          for (const [from, to] of replacements) {
            if (!index.includes(from)) throw new Error(`missing cache marker: ${from}`);
            index = index.replace(from, to);
          }
          fs.writeFileSync('index.html', index);

          const contractPath = 'tests/collaborative-interaction-delete-v47-contract.mjs';
          let contract = fs.readFileSync(contractPath, 'utf8');
          contract = contract.replace('|mobile-fix-v71', '');
          fs.writeFileSync(contractPath, contract);
          NODE
          rm .github/workflows/repair-cache-tags-v71.yml
          git diff --check
      - name: Commit repaired cache tags and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tests/collaborative-interaction-delete-v47-contract.mjs
          git rm --cached .github/workflows/repair-cache-tags-v71.yml
          git commit -m "Preserve established cache contract tags"
          git push origin HEAD:fix-mobile-share-allocation-settlement-20260820
