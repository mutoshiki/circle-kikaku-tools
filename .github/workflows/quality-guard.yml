name: Quality Guard

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  static:
    name: CSS lint and static contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Verify npm registry configuration
        shell: bash
        run: |
          test "$(npm config get registry)" = "https://registry.npmjs.org/"
      - name: Normalize lockfile registry URLs
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'package-lock.json';
          const internal = 'https://packages.applied-caas-gateway1.internal.api.openai.org/artifactory/api/npm/npm-public/';
          const publicRegistry = 'https://registry.npmjs.org/';
          const original = fs.readFileSync(path, 'utf8');
          const normalized = original.split(internal).join(publicRegistry);
          if (normalized.includes('internal.api.openai.org')) {
            throw new Error('An unsupported internal package registry URL remains in package-lock.json');
          }
          fs.writeFileSync(path, normalized);
          console.log(`Normalized ${(original.length - normalized.length) ? 'internal registry URLs' : '0 registry URLs'}.`);
          NODE
      - run: npm ci --no-audit --no-fund
      - run: npm run build:carbon
      - run: git diff --exit-code -- assets/vendor/carbon assets/vendor/ibm-plex
      - run: npm run lint:css
      - run: npm test

  browser:
    name: UI and visual regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Verify npm registry configuration
        shell: bash
        run: |
          test "$(npm config get registry)" = "https://registry.npmjs.org/"
      - name: Normalize lockfile registry URLs
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'package-lock.json';
          const internal = 'https://packages.applied-caas-gateway1.internal.api.openai.org/artifactory/api/npm/npm-public/';
          const publicRegistry = 'https://registry.npmjs.org/';
          const original = fs.readFileSync(path, 'utf8');
          const normalized = original.split(internal).join(publicRegistry);
          if (normalized.includes('internal.api.openai.org')) {
            throw new Error('An unsupported internal package registry URL remains in package-lock.json');
          }
          fs.writeFileSync(path, normalized);
          console.log(`Normalized ${(original.length - normalized.length) ? 'internal registry URLs' : '0 registry URLs'}.`);
          NODE
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: npm run test:visual
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
