name: Quality Guard

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  static:
    name: CSS lint, static contracts, and Firebase rules
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - run: node tools/apply-official-carbon-static-migration.mjs
      - run: npm run build:carbon
      - name: Upload generated Carbon migration output
        uses: actions/upload-artifact@v4
        with:
          name: official-carbon-migration-output
          path: |
            index.html
            assets/js/features/events/02-static-header-events.js
            assets/vendor/carbon/carbon-entry.min.js
            assets/vendor/carbon/ui-shell.min.js
            assets/vendor/carbon/build-manifest.json
          if-no-files-found: error
          retention-days: 2
      - run: git diff --exit-code -- assets/vendor/carbon assets/vendor/ibm-plex
      - run: npm run lint:css
      - run: npm test
      - run: npm run test:firebase:emulator

  browser:
    name: UI and visual regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node tools/apply-official-carbon-static-migration.mjs
      - run: npm run build:carbon
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:ui
      - run: npm run test:visual
      - run: npm run test:safari-sync
      - name: WebKit participants mobile regression
        run: npx playwright test tests/participants-tab-v83.spec.js --config=playwright.webkit.config.js
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  collaboration:
    name: Five-device collaboration simulation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node tools/apply-official-carbon-static-migration.mjs
      - run: npm run build:carbon
      - run: npm run test:collab:full
