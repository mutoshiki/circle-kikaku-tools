name: Quality Guard

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  static:
    name: CSS lint and static contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Reject private registry URLs in lockfiles
        shell: bash
        run: |
          lockfiles=()
          for file in package-lock.json npm-shrinkwrap.json pnpm-lock.yaml yarn.lock; do
            [[ -f "$file" ]] && lockfiles+=("$file")
          done
          if ((${#lockfiles[@]})) && grep -HnE 'internal\.api\.openai\.org|applied-caas-gateway' "${lockfiles[@]}"; then
            echo 'Lockfile contains a private registry URL that GitHub-hosted runners cannot access.'
            exit 1
          fi
      - run: npm ci --no-audit --no-fund
      - run: npm run build:carbon
      - name: Synchronize generated Carbon assets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          if ! git diff --quiet -- assets/vendor/carbon assets/vendor/ibm-plex; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add assets/vendor/carbon assets/vendor/ibm-plex
            git commit -m 'Sync generated Carbon assets'
            git push
          fi
      - run: git diff --exit-code -- assets/vendor/carbon assets/vendor/ibm-plex
      - run: npm run lint:css
      - run: npm test

  browser:
    name: UI and visual regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Reject private registry URLs in lockfiles
        shell: bash
        run: |
          lockfiles=()
          for file in package-lock.json npm-shrinkwrap.json pnpm-lock.yaml yarn.lock; do
            [[ -f "$file" ]] && lockfiles+=("$file")
          done
          if ((${#lockfiles[@]})) && grep -HnE 'internal\.api\.openai\.org|applied-caas-gateway' "${lockfiles[@]}"; then
            echo 'Lockfile contains a private registry URL that GitHub-hosted runners cannot access.'
            exit 1
          fi
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: npm run test:visual
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
