name: Patch participant list projection once

on:
  push:
    branches:
      - feat/participants-tab
    paths:
      - .github/workflows/patch-participant-list-projection-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/participants-tab
      - name: Project canonical allocation when returning to list
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/js/features/form-applicant-sync-v2.js')
          s = p.read_text()
          old = """  function restoreAllocationVisibility() {\n    const room = canonical();\n    const hasParticipants = Object.keys(room?.participants || {}).length > 0;\n    const bottomTray = byIdSafe('bottom-tray');\n    if (bottomTray) bottomTray.hidden = !hasParticipants;\n    window.updateUI?.();\n  }"""
          new = """  function restoreAllocationVisibility() {\n    const room = canonical();\n    const hasParticipants = Object.keys(room?.participants || {}).length > 0;\n    const bottomTray = byIdSafe('bottom-tray');\n    if (bottomTray) bottomTray.hidden = !hasParticipants;\n    // The Participants view edits canonical state without using the allocation DOM.\n    // Re-project canonical allocation before showing list mode so manual additions,\n    // winner changes, and remote participant updates cannot leave stale cards behind.\n    if (typeof window.renderActiveCarPlanToDom === 'function') window.renderActiveCarPlanToDom();\n    else window.updateUI?.();\n  }"""
          if old not in s:
              raise SystemExit('restoreAllocationVisibility block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/patch-participant-list-projection-once.yml
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/js/features/form-applicant-sync-v2.js .github/workflows/patch-participant-list-projection-once.yml
          git diff --cached --check
          git commit -m "参加者画面から車割へ戻る際にcanonicalを再投影"
          git push origin HEAD:feat/participants-tab
